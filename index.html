<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA RELEVAMIENTO CAHPSA - OFICIAL</title>
  <style>
    :root {
      --azul-cahpsa: #0a2d6e;
      --azul-medio: #1a4fa0;
      --azul-claro: #e8f0fe;
      --rojo-alerta: #d32f2f;
      --naranja-prox: #e65100;
      --amarillo-venc: #f9a825;
      --gris-fondo: #f0f3f8;
      --blanco: #ffffff;
      --texto-oscuro: #1a1a2e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--gris-fondo);
      padding: 10px; margin: 0;
      text-transform: uppercase;
    }
    .container {
      background: var(--blanco);
      padding: 25px; border-radius: 15px;
      max-width: 650px; margin: auto;
      box-shadow: 0 8px 25px rgba(10,45,110,0.13);
      border-top: 8px solid var(--azul-cahpsa);
    }
    .header-cahpsa { text-align: center; margin-bottom: 25px; }
    .header-cahpsa h2 {
      font-family: 'Georgia', serif;
      color: var(--azul-cahpsa); font-size: 30px;
      margin: 0 0 4px; font-weight: bold; letter-spacing: 2px;
    }
    .header-cahpsa h4 {
      color: #555; margin: 0; font-size: 11px;
      letter-spacing: 4px; font-weight: bold;
    }

    /* LOADING */
    #loading-overlay {
      position: fixed; inset: 0;
      background: rgba(10,45,110,0.88);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; color: white;
      font-size: 14px; font-weight: bold; letter-spacing: 2px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay.hidden { display: none; }
    #loading-msg { margin-top: 10px; font-size: 12px; opacity: 0.8; }

    label {
      font-weight: bold; display: block; margin-top: 20px;
      color: var(--azul-cahpsa); font-size: 12px; letter-spacing: 1px;
    }
    input, select {
      width: 100%; padding: 13px; margin-top: 6px;
      border: 2px solid #d0d8ec; border-radius: 8px;
      font-size: 14px; text-transform: uppercase;
      color: var(--texto-oscuro); background: #fdfdff;
      transition: border 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--azul-medio); }
    .p-prod, .p-vendedor {
      border: 2px solid var(--azul-cahpsa) !important;
      background-color: var(--azul-claro); font-weight: bold;
    }
    .input-error { border: 3px solid var(--rojo-alerta) !important; background-color: #ffebee !important; }
    .msg-error { color: var(--rojo-alerta); font-size: 10px; font-weight: bold; margin-top: 5px; display: none; }

    /* AUTOCOMPLETE */
    .autocomplete-wrapper { position: relative; }
    .autocomplete-wrapper input { width: 100%; }
    .autocomplete-dropdown {
      position: absolute; top: 100%; left: 0; right: 0;
      background: white; border: 2px solid var(--azul-cahpsa);
      border-top: none; border-radius: 0 0 10px 10px;
      max-height: 220px; overflow-y: auto; z-index: 1000;
      box-shadow: 0 8px 20px rgba(10,45,110,0.15); display: none;
    }
    .autocomplete-dropdown.visible { display: block; }
    .autocomplete-item {
      padding: 11px 15px; cursor: pointer;
      font-size: 12px; font-weight: bold; color: #333;
      border-bottom: 1px solid #f0f0f0; transition: background 0.15s;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.highlighted {
      background: var(--azul-claro); color: var(--azul-cahpsa);
    }
    .autocomplete-item .match-highlight {
      background: rgba(26,79,160,0.18); color: var(--azul-cahpsa);
      font-weight: 900; border-radius: 2px; padding: 0 1px;
    }
    .autocomplete-no-results {
      padding: 12px 15px; font-size: 12px;
      color: #999; font-style: italic; text-transform: none;
    }

    /* TABS */
    .selector-secciones { display: flex; gap: 8px; margin: 25px 0; flex-wrap: wrap; }
    .btn-tab {
      flex: 1; min-width: 100px; padding: 12px 5px;
      border: none; border-radius: 10px; font-weight: bold;
      cursor: pointer; background: #e0e6f0; color: #667;
      transition: 0.3s; font-size: 10px; letter-spacing: 1px;
    }
    .btn-tab.active-venc { background: var(--amarillo-venc); color: #fff; }
    .btn-tab.active-prox { background: var(--naranja-prox); color: #fff; }
    .btn-tab.active-aver { background: var(--rojo-alerta); color: #fff; }

    /* SI/NO */
    .pregunta-contenedor {
      background: var(--azul-claro); padding: 20px; border-radius: 12px;
      margin-bottom: 20px; text-align: center; border: 1px solid #c5d5f5;
    }
    .pregunta-contenedor span { font-size: 13px; font-weight: bold; color: var(--azul-cahpsa); }
    .botones-decision { display: flex; gap: 15px; max-width: 250px; margin: 15px auto 0; }
    .btn-sn {
      flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px;
      background: white; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s;
    }
    .active-si { background: #1b5e20 !important; color: white; border-color: #1b5e20 !important; }
    .active-no { background: var(--rojo-alerta) !important; color: white; border-color: var(--rojo-alerta) !important; }

    /* PRODUCTO ROWS */
    .seccion-productos { display: none; margin-top: 15px; }
    .producto-row {
      background: white; padding: 18px; margin-bottom: 15px;
      border-left: 6px solid var(--azul-cahpsa);
      border-radius: 8px; border: 1px solid #e0e8f5;
      box-shadow: 0 2px 8px rgba(10,45,110,0.06);
    }
    .btn-add {
      background: var(--azul-cahpsa); color: white; width: 100%;
      padding: 15px; border: none; border-radius: 8px; cursor: pointer;
      font-weight: bold; margin-top: 10px; letter-spacing: 1px; transition: background 0.2s;
    }
    .btn-add:hover { background: var(--azul-medio); }
    .btn-remove {
      background: #ff5252; color: white; font-size: 11px;
      padding: 8px 12px; border: none; border-radius: 5px;
      margin-top: 12px; cursor: pointer; float: right; font-weight: bold;
    }

    /* CHECKLIST */
    .checklist-container {
      background: #fafafa; border: 1px solid #ddd;
      padding: 10px; border-radius: 8px; margin-top: 8px;
    }
    .check-item {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px; cursor: pointer; font-size: 12px;
    }
    .check-item input[type="checkbox"] { width: 18px; height: 18px; margin: 0; cursor: pointer; }

    .btn-enviar {
      width: 100%; background: var(--azul-cahpsa); color: white;
      margin-top: 40px; font-size: 17px; padding: 22px;
      border: none; border-radius: 12px; cursor: pointer;
      font-weight: bold; letter-spacing: 2px; transition: background 0.2s;
    }
    .btn-enviar:hover { background: var(--azul-medio); }
    .btn-enviar:disabled { background: #9ab; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <span>CARGANDO DATOS CAHPSA...</span>
  <div id="loading-msg"></div>
</div>

<div class="container">
  <div class="header-cahpsa">
    <h2>CAHPSA</h2>
    <h4>CONTROL DE CALIDAD — RELEVAMIENTO</h4>
  </div>

  <form id="formulario">
    <label>NOMBRE DEL RELEVADOR</label>
    <div class="autocomplete-wrapper">
      <input type="text" id="vendedor" class="p-vendedor"
        placeholder="ESCRIBA PARA BUSCAR..." required autocomplete="off"
        oninput="onVendedorInput(this)"
        onkeydown="onVendedorKeydown(event)"
        onfocus="onVendedorFocus()">
      <div class="autocomplete-dropdown" id="vendedor-dropdown"></div>
    </div>

    <label>PUNTO DE VENTA</label>
    <select id="pdv" required>
      <option value="">-- PRIMERO SELECCIONE RELEVADOR --</option>
    </select>

    <div class="selector-secciones">
      <button type="button" id="tab-venc" class="btn-tab active-venc" onclick="cambiarTab('venc')">📅 VENCIDOS</button>
      <button type="button" id="tab-prox" class="btn-tab" onclick="cambiarTab('prox')">⏳ PRÓX. A VENCER</button>
      <button type="button" id="tab-aver" class="btn-tab" onclick="cambiarTab('aver')">⚠️ AVERIADOS</button>
    </div>

    <div id="panel-vencidos">
      <div class="pregunta-contenedor">
        <span>¿HAY PRODUCTOS VENCIDOS?</span>
        <div class="botones-decision">
          <button type="button" id="venc-si" class="btn-sn" onclick="decidirCarga('venc', true)">SÍ</button>
          <button type="button" id="venc-no" class="btn-sn" onclick="decidirCarga('venc', false)">NO</button>
        </div>
      </div>
      <div id="seccion-vencidos" class="seccion-productos">
        <div id="cont-vencidos"></div>
        <button type="button" class="btn-add" onclick="agregarFila('venc')">+ AÑADIR PRODUCTO</button>
      </div>
    </div>

    <div id="panel-proximos" style="display:none;">
      <div class="pregunta-contenedor">
        <span>¿HAY PRODUCTOS PRÓXIMOS A VENCER?</span>
        <div class="botones-decision">
          <button type="button" id="prox-si" class="btn-sn" onclick="decidirCarga('prox', true)">SÍ</button>
          <button type="button" id="prox-no" class="btn-sn" onclick="decidirCarga('prox', false)">NO</button>
        </div>
      </div>
      <div id="seccion-proximos" class="seccion-productos">
        <div id="cont-proximos"></div>
        <button type="button" class="btn-add" onclick="agregarFila('prox')">+ AÑADIR PRODUCTO</button>
      </div>
    </div>

    <div id="panel-averiados" style="display:none;">
      <div class="pregunta-contenedor">
        <span>¿HAY PRODUCTOS AVERIADOS?</span>
        <div class="botones-decision">
          <button type="button" id="aver-si" class="btn-sn" onclick="decidirCarga('aver', true)">SÍ</button>
          <button type="button" id="aver-no" class="btn-sn" onclick="decidirCarga('aver', false)">NO</button>
        </div>
      </div>
      <div id="seccion-averiados" class="seccion-productos">
        <div id="cont-averiados"></div>
        <button type="button" class="btn-add" onclick="agregarFila('aver')">+ AÑADIR AVERÍA</button>
      </div>
    </div>

    <button type="submit" class="btn-enviar" id="btnEnvio">ENVIAR REPORTE</button>
  </form>
</div>

<script>
// ================================================================
//  CONFIGURACIÓN
// ================================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCCzGrIHofXlZREKuKek0bkO0rXsD-VjdBjELWfEkq-CbWdhJIIL4hETYuk8q8H1ULBg/exec";

let datosPDV = {};
let PRODUCTOS_VALIDOS = [];
let todosLosRelevadores = [];

// ================================================================
//  CARGA DE DATOS VÍA JSONP (evita bloqueo CORS desde GitHub Pages)
// ================================================================
function cargarDatosJSONP() {
  return new Promise(function(resolve, reject) {
    const callbackName = "cahpsaCallback_" + Date.now();
    const script = document.createElement("script");
    let timeout;

    window[callbackName] = function(data) {
      clearTimeout(timeout);
      document.body.removeChild(script);
      delete window[callbackName];
      resolve(data);
    };

    timeout = setTimeout(function() {
      if (document.body.contains(script)) document.body.removeChild(script);
      delete window[callbackName];
      reject(new Error("Timeout al cargar datos"));
    }, 15000);

    script.src = SCRIPT_URL + "?action=getData&callback=" + callbackName;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[callbackName];
      reject(new Error("Error de red"));
    };
    document.body.appendChild(script);
  });
}

// ── Intentar primero con fetch, fallback a JSONP ─────────────────
window.addEventListener("DOMContentLoaded", function() {
  document.getElementById("loading-msg").textContent = "Conectando con Google Sheets...";

  fetch(SCRIPT_URL + "?action=getData")
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(inicializarDatos)
    .catch(function() {
      // fetch falló (CORS) → intentar JSONP
      document.getElementById("loading-msg").textContent = "Cargando vía método alternativo...";
      return cargarDatosJSONP().then(inicializarDatos);
    })
    .catch(function(err) {
      document.getElementById("loading-overlay").innerHTML =
        '<div style="text-align:center;padding:30px;color:white;">' +
        '<div style="font-size:40px;margin-bottom:15px;">⚠️</div>' +
        '<div style="font-weight:bold;font-size:16px;margin-bottom:10px;">ERROR AL CARGAR DATOS</div>' +
        '<div style="font-size:12px;opacity:0.8;margin-bottom:20px;">Verificá tu conexión a internet y que el script de Google esté publicado correctamente.</div>' +
        '<button onclick="location.reload()" style="padding:12px 25px;background:white;color:#0a2d6e;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;">🔄 REINTENTAR</button>' +
        '</div>';
    });
});

function inicializarDatos(data) {
  datosPDV = data.pdvMap || {};
  PRODUCTOS_VALIDOS = data.productos || [];
  todosLosRelevadores = Object.keys(datosPDV).sort();
  document.getElementById("loading-overlay").classList.add("hidden");
}

// ================================================================
//  UTILIDADES
// ================================================================
function normalizarTexto(t) {
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function resaltarCoincidencia(nombre, query) {
  const nNorm = normalizarTexto(nombre);
  const qNorm = normalizarTexto(query);
  const idx = nNorm.indexOf(qNorm);
  if (idx === -1) return nombre;
  return nombre.substring(0, idx) +
    '<span class="match-highlight">' + nombre.substring(idx, idx + query.length) + '</span>' +
    nombre.substring(idx + query.length);
}

// ================================================================
//  AUTOCOMPLETE RELEVADOR
// ================================================================
let highlightedIndex = -1;

function onVendedorInput(input) {
  input.value = input.value.toUpperCase();
  const query = input.value.trim();
  if (query.length < 2) { cerrarDropdown(); actualizarPDV(); return; }
  const res = todosLosRelevadores.filter(n => normalizarTexto(n).includes(normalizarTexto(query)));
  mostrarDropdown(res, query);
  actualizarPDV();
}
function onVendedorFocus() {
  const query = document.getElementById("vendedor").value.trim();
  if (query.length >= 2) {
    const res = todosLosRelevadores.filter(n => normalizarTexto(n).includes(normalizarTexto(query)));
    mostrarDropdown(res, query);
  }
}
function onVendedorKeydown(event) {
  const dd = document.getElementById("vendedor-dropdown");
  const items = dd.querySelectorAll(".autocomplete-item");
  if (event.key === "ArrowDown") { event.preventDefault(); highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1); actualizarHighlight(items); }
  else if (event.key === "ArrowUp") { event.preventDefault(); highlightedIndex = Math.max(highlightedIndex - 1, 0); actualizarHighlight(items); }
  else if (event.key === "Enter") { event.preventDefault(); if (highlightedIndex >= 0 && items[highlightedIndex]) seleccionarRelevador(items[highlightedIndex].dataset.valor); }
  else if (event.key === "Escape") cerrarDropdown();
}
function actualizarHighlight(items) {
  items.forEach((it, i) => it.classList.toggle("highlighted", i === highlightedIndex));
  if (items[highlightedIndex]) items[highlightedIndex].scrollIntoView({ block: "nearest" });
}
function mostrarDropdown(resultados, query) {
  const dd = document.getElementById("vendedor-dropdown");
  highlightedIndex = -1;
  dd.innerHTML = resultados.length === 0
    ? `<div class="autocomplete-no-results">Sin resultados para "${query}"</div>`
    : resultados.map(n => `<div class="autocomplete-item" data-valor="${n}" onmousedown="seleccionarRelevador('${n.replace(/'/g,"\\'")}')">
        ${resaltarCoincidencia(n, query)}</div>`).join("");
  dd.classList.add("visible");
}
function cerrarDropdown() {
  document.getElementById("vendedor-dropdown").classList.remove("visible");
  highlightedIndex = -1;
}
function seleccionarRelevador(nombre) {
  document.getElementById("vendedor").value = nombre;
  cerrarDropdown(); actualizarPDV();
}
document.addEventListener("click", function(e) {
  if (!e.target.closest(".autocomplete-wrapper")) {
    document.querySelectorAll(".autocomplete-dropdown").forEach(d => d.classList.remove("visible"));
  }
});
function actualizarPDV() {
  const rel = document.getElementById("vendedor").value;
  const sel = document.getElementById("pdv");
  if (datosPDV[rel]) {
    sel.innerHTML = '<option value="">-- SELECCIONE PDV --</option>';
    datosPDV[rel].forEach(p => { const o = document.createElement("option"); o.value = o.textContent = p; sel.appendChild(o); });
  } else {
    sel.innerHTML = '<option value="">-- RELEVADOR NO VÁLIDO --</option>';
  }
}

// ================================================================
//  TABS
// ================================================================
function cambiarTab(t) {
  ["venc","prox","aver"].forEach(x => {
    document.getElementById("panel-" + (x==="venc"?"vencidos":x==="prox"?"proximos":"averiados")).style.display = x === t ? "block" : "none";
    document.getElementById("tab-" + x).className = "btn-tab" + (x === t ? " active-" + x : "");
  });
}

// ================================================================
//  SI / NO
// ================================================================
let respuestas = { venc: null, prox: null, aver: null };
function decidirCarga(tipo, tiene) {
  respuestas[tipo] = tiene;
  document.getElementById(tipo + "-si").className = tiene  ? "btn-sn active-si" : "btn-sn";
  document.getElementById(tipo + "-no").className = !tiene ? "btn-sn active-no" : "btn-sn";
  const id = tipo === "venc" ? "vencidos" : tipo === "prox" ? "proximos" : "averiados";
  document.getElementById("seccion-" + id).style.display = tiene ? "block" : "none";
  const cont = document.getElementById("cont-" + id);
  if (tiene && cont.children.length === 0) agregarFila(tipo);
}

// ================================================================
//  AUTOCOMPLETE PRODUCTOS
// ================================================================
let prodHighlightIndex = {};

function onProductoInput(input, uid) {
  input.value = input.value.toUpperCase();
  const q = input.value.trim();
  if (q.length < 2) { cerrarDropdownProducto(uid); validarProducto(input); return; }
  const res = PRODUCTOS_VALIDOS.filter(p => normalizarTexto(p).includes(normalizarTexto(q))).slice(0, 30);
  mostrarDropdownProducto(uid, res, q);
  validarProducto(input);
}
function onProductoFocus(input, uid) {
  const q = input.value.trim();
  if (q.length >= 2) {
    const res = PRODUCTOS_VALIDOS.filter(p => normalizarTexto(p).includes(normalizarTexto(q))).slice(0, 30);
    mostrarDropdownProducto(uid, res, q);
  }
}
function mostrarDropdownProducto(uid, resultados, query) {
  const dd = document.getElementById("prod-drop-" + uid);
  prodHighlightIndex[uid] = -1;
  dd.innerHTML = resultados.length === 0
    ? `<div class="autocomplete-no-results">Sin resultados para "${query}"</div>`
    : resultados.map(p => `<div class="autocomplete-item" data-valor="${p.replace(/"/g,'&quot;')}" onmousedown="seleccionarProducto(this,'${uid}')">
        ${resaltarCoincidencia(p, query)}</div>`).join("");
  dd.classList.add("visible");
}
function cerrarDropdownProducto(uid) {
  const d = document.getElementById("prod-drop-" + uid);
  if (d) d.classList.remove("visible");
  prodHighlightIndex[uid] = -1;
}
function seleccionarProducto(item, uid) {
  document.getElementById("prod-drop-" + uid).closest(".autocomplete-wrapper").querySelector(".p-prod").value = item.dataset.valor;
  cerrarDropdownProducto(uid);
  validarProducto(document.getElementById("prod-drop-" + uid).closest(".autocomplete-wrapper").querySelector(".p-prod"));
}
function onProductoKeydown(event, uid) {
  const dd = document.getElementById("prod-drop-" + uid);
  const items = dd.querySelectorAll(".autocomplete-item");
  if (prodHighlightIndex[uid] === undefined) prodHighlightIndex[uid] = -1;
  if (event.key === "ArrowDown") { event.preventDefault(); prodHighlightIndex[uid] = Math.min(prodHighlightIndex[uid]+1, items.length-1); items.forEach((it,i)=>it.classList.toggle("highlighted",i===prodHighlightIndex[uid])); if(items[prodHighlightIndex[uid]])items[prodHighlightIndex[uid]].scrollIntoView({block:"nearest"}); }
  else if (event.key === "ArrowUp") { event.preventDefault(); prodHighlightIndex[uid] = Math.max(prodHighlightIndex[uid]-1, 0); items.forEach((it,i)=>it.classList.toggle("highlighted",i===prodHighlightIndex[uid])); if(items[prodHighlightIndex[uid]])items[prodHighlightIndex[uid]].scrollIntoView({block:"nearest"}); }
  else if (event.key === "Enter") { event.preventDefault(); if(prodHighlightIndex[uid]>=0&&items[prodHighlightIndex[uid]])seleccionarProducto(items[prodHighlightIndex[uid]],uid); }
  else if (event.key === "Escape") cerrarDropdownProducto(uid);
}
function validarProducto(input) {
  const row = input.closest(".producto-row");
  const err = row ? row.querySelector(".msg-error") : null;
  const valido = input.value === "" || PRODUCTOS_VALIDOS.includes(input.value);
  input.classList.toggle("input-error", !valido);
  if (err) err.style.display = valido ? "none" : "block";
}

// ================================================================
//  CHECKLIST AVERÍA
// ================================================================
function toggleOtros(checkbox) {
  const inp = checkbox.closest(".producto-row").querySelector(".input-otros-especificar");
  inp.style.display = checkbox.checked ? "block" : "none";
  if (!checkbox.checked) inp.value = "";
}

// ================================================================
//  AGREGAR FILA
// ================================================================
function agregarFila(tipo) {
  const idCont = tipo === "venc" ? "vencidos" : tipo === "prox" ? "proximos" : "averiados";
  const cont = document.getElementById("cont-" + idCont);
  const div = document.createElement("div");
  div.className = "producto-row";
  div.style.borderLeftColor = tipo === "venc" ? "var(--amarillo-venc)" : tipo === "prox" ? "var(--naranja-prox)" : "var(--rojo-alerta)";

  const uid = Date.now() + Math.random().toString(36).slice(2);

  const campoFecha = `<div style="flex:2"><label>FECHA DE VENCIMIENTO</label><input type="date" class="p-extra" required></div>`;
  const camposAver = `<div style="flex:2"><label>TIPO DE AVERÍA</label>
    <div class="checklist-container">
      <label class="check-item"><input type="checkbox" value="CAJA MOJADA"> CAJA MOJADA</label>
      <label class="check-item"><input type="checkbox" value="PRODUCTO CONSUMIDO EN PDV"> PRODUCTO CONSUMIDO EN PDV</label>
      <label class="check-item"><input type="checkbox" value="CAJA APLASTADA"> CAJA APLASTADA</label>
      <label class="check-item"><input type="checkbox" value="CAJA ROTA"> CAJA ROTA</label>
      <label class="check-item"><input type="checkbox" value="PRODUCTO DAÑADO POR ROEDORES"> PRODUCTO DAÑADO POR ROEDORES</label>
      <label class="check-item"><input type="checkbox" value="OTROS" onchange="toggleOtros(this)"> OTROS (ESPECIFICAR)</label>
      <input type="text" class="input-otros-especificar" placeholder="ESCRIBA EL MOTIVO..."
        style="display:none;margin-top:5px;padding:10px;" oninput="this.value=this.value.toUpperCase()">
    </div></div>`;

  div.innerHTML = `
    <label>PRODUCTO (SELECCIÓN OBLIGATORIA)</label>
    <div class="autocomplete-wrapper">
      <input type="text" class="p-prod" placeholder="BUSCAR PRODUCTO..." required autocomplete="off"
        oninput="onProductoInput(this,'${uid}')"
        onkeydown="onProductoKeydown(event,'${uid}')"
        onfocus="onProductoFocus(this,'${uid}')">
      <div class="autocomplete-dropdown" id="prod-drop-${uid}"></div>
    </div>
    <span class="msg-error">⚠️ DEBE SELECCIONAR UN PRODUCTO DE LA LISTA</span>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
      ${tipo === "aver" ? camposAver : campoFecha}
      <div style="flex:1"><label>CANTIDAD (OBLIGATORIO)</label><input type="number" class="p-cant" min="1" placeholder="EJ: 5" required></div>
    </div>
    <button type="button" class="btn-remove" onclick="this.parentElement.remove()">ELIMINAR</button>
    <div style="clear:both"></div>`;
  cont.appendChild(div);
}

// ================================================================
//  ENVÍO
// ================================================================
document.getElementById("formulario").onsubmit = function(e) {
  e.preventDefault();

  if (respuestas.venc === null || respuestas.prox === null || respuestas.aver === null) {
    alert("DEBE COMPLETAR TODOS LOS APARTADOS (VENCIDOS, PRÓXIMOS Y AVERIADOS)."); return;
  }
  if (!datosPDV[document.getElementById("vendedor").value]) {
    alert("POR FAVOR SELECCIONE UN RELEVADOR VÁLIDO DE LA LISTA."); return;
  }

  let hayErrores = false;
  document.querySelectorAll(".p-prod").forEach(input => {
    if (!PRODUCTOS_VALIDOS.includes(input.value)) {
      input.classList.add("input-error");
      const err = input.closest(".producto-row") ? input.closest(".producto-row").querySelector(".msg-error") : null;
      if (err) err.style.display = "block";
      hayErrores = true;
    }
  });
  if (hayErrores) { alert("❌ HAY PRODUCTOS NO VÁLIDOS EN LA LISTA."); return; }

  const btn = document.getElementById("btnEnvio");
  btn.disabled = true; btn.innerText = "ENVIANDO...";

  const payload = {
    relevador:      document.getElementById("vendedor").value,
    pdv:            document.getElementById("pdv").value,
    tieneVencidos:  respuestas.venc,
    tieneProximos:  respuestas.prox,
    tieneAveriados: respuestas.aver,
    vencidos: [], proximos: [], averiados: []
  };

  document.querySelectorAll("#cont-vencidos .producto-row").forEach(r => {
    payload.vencidos.push({ producto: r.querySelector(".p-prod").value, fecha: r.querySelector(".p-extra").value, cant: r.querySelector(".p-cant").value });
  });
  document.querySelectorAll("#cont-proximos .producto-row").forEach(r => {
    payload.proximos.push({ producto: r.querySelector(".p-prod").value, fecha: r.querySelector(".p-extra").value, cant: r.querySelector(".p-cant").value });
  });

  let checklistValido = true;
  document.querySelectorAll("#cont-averiados .producto-row").forEach(r => {
    let sel = [];
    r.querySelectorAll(".checklist-container input[type='checkbox']:checked").forEach(chk => {
      sel.push(chk.value === "OTROS" ? "OTROS: " + (r.querySelector(".input-otros-especificar").value || "SIN ESPECIFICAR") : chk.value);
    });
    if (sel.length === 0) {
      alert("POR FAVOR SELECCIONE AL MENOS UN TIPO DE AVERÍA.");
      btn.disabled = false; btn.innerText = "ENVIAR REPORTE";
      checklistValido = false; return;
    }
    payload.averiados.push({ producto: r.querySelector(".p-prod").value, observacion: sel.join(" | "), cant: r.querySelector(".p-cant").value });
  });
  if (!checklistValido) return;

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(payload)
  }).then(() => {
    alert("✅ REPORTE ENVIADO CORRECTAMENTE — CAHPSA");
    location.reload();
  }).catch(() => {
    alert("❌ ERROR AL ENVIAR. VERIFICÁ TU CONEXIÓN.");
    btn.disabled = false; btn.innerText = "ENVIAR REPORTE";
  });
};
</script>
</body>
</html>
